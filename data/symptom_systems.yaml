# Symptom -> body-system mapping.
#
# Consumed by the `analyze_symptoms` skill, which groups a described symptom set by system and
# reports whether the pattern is confined to one system or spans several.  That single/multi-system
# distinction is the skill's actual output; the mapping below is what makes it computable.
#
# Matching contract:
#
#   * `terms` are literal lowercase phrases matched case-insensitively on word boundaries, the same
#     mechanism as data/red_flags.yaml.  A phrase may appear under more than one system on purpose
#     -- "chest tightness" is both cardiovascular and respiratory, and forcing a single owner would
#     encode a diagnosis the skill is not entitled to make.  The skill reports every system a term
#     maps to.
#   * This file describes WHERE a symptom is felt, not what causes it.  It contains no diagnostic
#     logic, no likelihood, and no urgency: urgency lives in data/red_flags.yaml, and this file must
#     never be used as a substitute for it.
#   * Systems are the ten named in the build brief.  A term that fits none of them belongs under
#     `constitutional`, which is the whole-body bucket, not a fallback for unclassified input.

schema_version: 1

systems:
  cardiovascular:
    label: "Cardiovascular"
    terms:
      - "chest pain"
      - "chest pressure"
      - "chest tightness"
