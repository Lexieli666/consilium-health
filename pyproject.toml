[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consilium-health"
version = "0.1.0"
description = "Multi-agent clinical-information assistant with hybrid retrieval, enforced safety policy, and a trace-derived evaluation harness."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
keywords = ["llm", "agents", "rag", "multi-agent", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Upper bounds are deliberate.  Every dependency below is capped at the next major (or the next
# CalVer year, for structlog) so that a floor-only specification cannot silently pull in a breaking
# release between the commit that produced the published evaluation numbers and a later checkout.
# The exact resolved versions live in uv.lock, which is committed.
dependencies = [
    "pydantic>=2.7,<3",
    "openai>=2.0,<3",
    "anthropic>=0.100,<1",
    "rank-bm25==0.2.2",         # unmaintained since 2022; pinned exactly, see docs/DESIGN.md
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sse-starlette>=3,<4",
    "pyyaml>=6,<7",
    "structlog>=26,<27",
    "tenacity>=9,<10",
    "typer>=0.15,<1",
    "python-dotenv>=1,<2",
    "numpy>=1.26,<3",           # required by the NumpyStore seam mandated by the offline test rule
    "mcp>=2.1,<3",              # the official MCP SDK; core rather than an extra, see below
]

# WHY `mcp` IS A CORE DEPENDENCY AND NOT AN EXTRA.  The one extra this project has, `embeddings`,
# is deliberately never installed in CI because it drags in multi-GB torch wheels, and the offline
# `Embedder`/`VectorStore` seams exist so that CI never needs it.  Neither half of that reasoning
# applies here.  `mcp` is pure Python and its transitive dependencies -- starlette, uvicorn,
# sse-starlette, pydantic, httpx -- are already resolved for the HTTP API, so the install cost is
# close to nothing.  More decisively: Part B's acceptance criterion is that each MCP tool's schema
# round-trips through an SDK client, offline, in pytest.  A contract test that is skipped on the
# machine running the PR gate is not a gate, and an extra that CI does not install is exactly how a
# test becomes decorative.  The MCP server is also a shipped interface, like `consilium/api/`, and
# `consilium mcp-serve` is a console-script command: a command that raises ImportError on an
# installed wheel is the trap that keeps `eval` out of the package rather than a pattern to copy.

[project.optional-dependencies]
# Never installed in CI: sentence-transformers drags in multi-GB torch wheels.  The offline test
# rule is satisfied by the Embedder/VectorStore protocols, not by mocking these packages.
embeddings = [
    "sentence-transformers>=5,<6",
    "chromadb>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6,<7",
]

# The console script lands in Phase 2, with the first command it can actually run.  The rule it was
# deferred under -- no script pointing at a module that does not exist -- is now satisfied:
# `consilium ingest` builds the retrieval index.  [project.urls] still waits for Phase 10.
[project.scripts]
consilium = "consilium.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["consilium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `--cov=eval` was added in Phase 8.  The evaluation harness computes every number this project
# publishes, so leaving it as the one module whose coverage nobody measures would be the wrong
# place to save a flag.  It is a top-level package rather than part of `consilium/` because the
# brief specifies `eval/run.py` and because it is not shipped in the wheel.
addopts = "-m 'not network' --cov=consilium --cov=eval --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "network: requires network access, a live API key, or a model download; excluded by default",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["consilium", "eval"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["consilium", "eval", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # bugbear
    "C4",    # comprehensions
    "UP",    # pyupgrade
    "SIM",   # simplify
    "RUF",   # ruff-specific
    "ARG",   # unused arguments
    "PTH",   # prefer pathlib
    "T20",   # no print()
    "ASYNC", # async antipatterns
    "S",     # bandit-style security checks
    "TRY",   # exception antipatterns (bare except, swallowed errors)
]
ignore = [
    "TRY003",  # long messages in raise; readable errors beat exception subclass sprawl here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "ARG002"]  # assert is the point; fixtures are injected unused
"eval/run.py" = ["T20"]  # a report generator writes to stdout; that is its output, not a log
"eval/publish.py" = ["T20"]  # same: the publication tool reports what it published

[tool.ruff.lint.isort]
known-first-party = ["consilium", "eval"]

[tool.mypy]
# Type-check at the floor, not above it.  3.12 is `requires-python`'s lower bound and the lowest
# interpreter CI runs, so a run that passes here is a statement about the oldest Python this
# package claims to support; checking under a newer version would type-check code against a
# standard library the floor does not have.  Compatibility upward is enforced by the interpreter
# matrix rather than by the type checker.
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["consilium", "eval", "tests"]

[[tool.mypy.overrides]]
# `redis` is deliberately not a dependency: it is supported as an optional backend and is
# imported inside `RedisBackend.__init__`, so the package must import cleanly without it.
module = ["rank_bm25.*", "chromadb.*", "sentence_transformers.*", "redis.*"]
ignore_missing_imports = true
