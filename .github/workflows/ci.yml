name: ci

on:
  push:
    branches: [main]
  pull_request:

# No secrets are configured for this workflow on purpose.  The whole suite must pass with no API
# key, no model download and no network access; anything that genuinely needs one of those is
# marked `network` and excluded here.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      CONSILIUM_PROVIDER: mock

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies only
        # --frozen fails if uv.lock is stale, so a dependency change that was not locked cannot
        # reach main.  The [embeddings] extra is deliberately not installed: it pulls multi-GB
        # torch wheels, and the offline test seams exist so CI never needs them.
        run: uv sync --frozen --no-extra embeddings

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest (offline)
        run: uv run pytest -m "not network"
