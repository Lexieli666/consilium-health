# Offline script for `python -m consilium.graph --mock "<question>"`.
#
# Replayed by MockProvider in call order: the planner call requests one MCP tool, the synthesizer
# then writes a draft that is deliberately missing the required disclaimer, so the validator sends
# it back once and the second synthesis carries the disclaimer.  Nothing here is a measurement;
# it exists so the graph's four nodes and its repair edge can be exercised with no key.
responses:
  - tool_calls:
      - name: search_knowledge
        arguments: {query: "sepsis red flag symptoms"}
  - content: >-
      The retrieved notes (red-flag table) list the warning signs of sepsis as fever with
      confusion, a rapid heart rate, fast breathing, and skin that is mottled or very pale. Any of
      these alongside a known infection is treated as an emergency: seek emergency care now.
