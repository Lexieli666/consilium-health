# Token rates, in US dollars per million tokens, keyed on `llm_call.provider` + "/" + `.model`.
#
# THIS FILE SHIPS EMPTY ON PURPOSE.
#
# Every number this project publishes has to come from a measurement or be written `not measured`.
# A rate card copied from a vendor page at some point in the past is neither: it is a number that
# looks measured, goes stale silently, and would put a fabricated dollar figure into the results
# table.  So the operator fills this in from their provider's current price list at the time of the
# run, and `eval/run.py` records the rates it used in `summary.json` alongside the cost it computed.
#
# When a model used in a run has no entry here, cost per turn is reported as `not measured` and the
# model is listed under `unpriced_models`.  It is never reported as an undercount: a partial cost is
# more misleading than no cost, because it reads as complete.
#
# Format:
#
#   "<provider>/<model>":
#     input: <dollars per million input tokens>
#     output: <dollars per million output tokens>
#
# The bare model name also works as a key, for a provider-agnostic rate.
#
# Example, with placeholder rates that are NOT real prices -- replace them, do not uncomment them:
#
#   "openai/gpt-4o-mini":
#     input: 0.00
#     output: 0.00

# Filled in on 2026-10-13 for the GCP-migration comparison (docs/gcp-migration-eval.md), from the
# providers' public price lists on that date -- standard tier, text, prompts <= 200k tokens:
#   openai/gpt-4o-mini        https://developers.openai.com/api/docs/models/gpt-4o-mini
#   vertexai/gemini-2.5-flash https://cloud.google.com/vertex-ai/generative-ai/pricing
# Gemini's output rate covers reasoning ("thinking") tokens, which is why the ADK trace adds
# `thoughts_token_count` into `completion_tokens` (consilium/adk/agents.py).  The judge's calls are
# not traced and are not in any cost-per-turn figure; see eval/run.py.
# `llm_call.model` is the id the provider *returns*, which for OpenAI carries the snapshot date;
# both forms are listed so that the pre-sweep --max-cost check (CONSILIUM_MODEL) and the per-call
# pricing (the returned id) resolve to the same rate.
rates:
  "openai/gpt-4o-mini":
    input: 0.15
    output: 0.60
  "openai/gpt-4o-mini-2024-07-18":
    input: 0.15
    output: 0.60
  "vertexai/gemini-2.5-flash":
    input: 0.30
    output: 2.50
